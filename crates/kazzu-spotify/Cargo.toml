[package]
name = "kazzu-spotify"
version = "0.1.0"
edition = "2024"
description = "Spotify provider implementation for Kazzu, following the kazzu-ytm pattern"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/kazzu"
keywords = ["spotify", "music", "provider", "async-trait"]
categories = ["audio", "music"]

[dependencies]
kazzu-core = { path = "../kazzu-core" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }
url = "2.4"
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
blocking = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
directories = "6.0"