[package]
name = "kazzu-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kazzu: interface desktop (Slint) do player de música"
build = "build.rs"

[[bin]]
name = "kazzu"
path = "src/main.rs"

[features]
default = ["demo"]
# Gera uma biblioteca de demonstração (WAV/FLAC fictícios com tags e capa) para `--demo-library`.
demo = ["dep:hound", "dep:flacenc", "dep:lofty"]
# Renderer Skia (opt-in; baixa binários do Skia no build). Útil para iOS/Android no futuro.
skia = ["slint/renderer-skia"]

[dependencies]
kazzu-core = { path = "../kazzu-core" }
kazzu-audio = { path = "../kazzu-audio" }
kazzu-library = { path = "../kazzu-library" }

slint = { version = "1.19", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-2",
] }
pollster = "0.4"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
crossbeam-channel = "0.5"
directories = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
thiserror = "2"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

hound = { version = "3.5", optional = true }
flacenc = { version = "0.5", optional = true }
lofty = { version = "0.25", optional = true }

[build-dependencies]
slint-build = "1.19"

[dev-dependencies]
hound = "3.5"
lofty = "0.25"
tempfile = "3"
